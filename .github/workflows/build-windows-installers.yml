name: Compilar Instaladores Windows (.EXE y .MSI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-installers:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del proyecto y empaquetado Electron
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev --legacy-peer-deps electron@^33.2.0 electron-builder@^25.1.8

      - name: Verificar icono Windows (.ICO)
        run: node installer/ensure-icon.mjs

      - name: Compilar aplicación para escritorio y generar .EXE + .MSI
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx vite build --base=./
          npx electron-builder --win nsis msi --x64 --config electron-builder.yml

      - name: Publicar instaladores finales (.EXE y .MSI)
        uses: actions/upload-artifact@v4
        with:
          name: PixelClashStudio-Installers-Windows-x64
          path: |
            release/*.exe
            release/*.msi
