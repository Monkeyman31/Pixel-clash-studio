name: Compilar Instaladores Windows Rust/Tauri (.EXE y .MSI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-installers:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar toolchain nativo Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias Cargo (Rust)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias frontend y CLI de Tauri v2
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev --legacy-peer-deps @tauri-apps/cli@^2.2.0

      - name: Verificar icono Windows (.ICO)
        run: node installer/ensure-icon.mjs

      - name: Compilar frontend + binario nativo Rust y generar .EXE + .MSI
        run: |
          npx vite build --base=./
          npx tauri build --bundles nsis,msi

      - name: Publicar instaladores finales (.EXE y .MSI)
        uses: actions/upload-artifact@v4
        with:
          name: PixelClashStudio-Rust-Installers-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
