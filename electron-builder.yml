appId: com.pixelclash.studio
productName: "PixelClash Studio"
copyright: "Copyright © 2026 PixelClash Studio"
extraMetadata:
  main: electron/main.cjs
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - electron/**/*
  - assets/pixelclash.ico
  - package.json
win:
  icon: assets/pixelclash.ico
  executableName: PixelClashStudio
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  publisherName: "PixelClash Studio"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "PixelClash Studio"
  installerIcon: assets/pixelclash.ico
  uninstallerIcon: assets/pixelclash.ico
  installerHeaderIcon: assets/pixelclash.ico
  uninstallDisplayName: "PixelClash Studio"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - es_ES
  language: "3082"
  artifactName: "PixelClashStudio-Setup-${version}-x64.exe"
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "PixelClash Studio"
  artifactName: "PixelClashStudio-${version}-x64.msi"
fileAssociations:
  - ext: pcs
    name: "Proyecto PixelClash Studio"
    description: "Proyecto editable de PixelClash Studio"
    icon: assets/pixelclash.ico
    role: Editor
