[package]
name = "pixelclash-studio"
version = "2.0.0"
description = "PixelClash Studio — Editor profesional de Pixel Art, Sprites, Escenarios y Animación"
authors = ["PixelClash Studio"]
license = "MIT"
edition = "2021"

[lib]
name = "pixelclash_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
